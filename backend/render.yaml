services:
  - type: web
    name: eco-tech-backend
    runtime: java
    buildCommand: "./mvnw -q -DskipTests clean package"
    startCommand: "java -jar target/backend-1.0.0.jar"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SUPABASE_STORAGE_URL
        sync: false
      - key: SUPABASE_STORAGE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:admin@ecotech.local"
      - key: ESKOM_API_KEY
        sync: false
      - key: ALERTS_INGEST_INTERVAL_MS
        value: "900000"
    healthCheckPath: /api/v1/public/health
